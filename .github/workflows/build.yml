name: Build executables

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            executable: dist/video-pedal
          - os: windows-2022
            target: windows-x86_64
            executable: dist/video-pedal.exe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Linux GUI and build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libegl1 libglib2.0-0 \
            libx11-6 libxext6 libxrender1 libsm6 libice6 libxcb1 libxcb-xinerama0 \
            libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 xvfb xauth
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm video-pedal.spec
      - name: Test frozen executable (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          VIDEO_PEDAL_EXECUTABLE: ${{ matrix.executable }}
        run: |
          test -x "$VIDEO_PEDAL_EXECUTABLE"
          xvfb-run -a python -m pytest tests/test_frozen.py -q
      - name: Test frozen executable (Windows)
        if: runner.os == 'Windows'
        env:
          VIDEO_PEDAL_EXECUTABLE: ${{ matrix.executable }}
        run: python -m pytest tests/test_frozen.py -q
      - name: Archive Linux executable (preserve executable permission)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/video-pedal-linux-x86_64.tar.gz video-pedal
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: video-pedal-linux-x86_64
          path: dist/video-pedal-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: video-pedal-windows-x86_64
          path: dist/video-pedal.exe
          if-no-files-found: error
